[project]
name = "cinecircle-api"
version = "0.1.0"
description = "CineCircle backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinecircle_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs local Supabase Postgres"]
# Plain `pytest` (and IDE runs) skip DB tests; `-m integration` overrides this.
addopts = "-m 'not integration'"
# Starlette suggests a renamed httpx package; keep the well-known httpx for now.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
